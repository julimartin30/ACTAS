<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#b0001e">
  <title>Actas de partido</title>
  <link rel="icon" href="assets/icono.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <img class="logo" src="assets/logo.png" alt="FEDC · Federación Española de Deportes para Ciegos">
    <div class="marca"><b>Actas de partido</b><small id="sub-org">Fútbol sala · Fútbol 5</small></div>
    <div class="espacio"></div>
    <div class="usuario" id="usuario-actual" hidden></div>
    <button class="btn btn-peq" id="btn-salir" type="button" hidden>Salir</button>
  </header>
  <main id="app"></main>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="js/cripto.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/pdf-acta.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
